<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISC Profiltest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Samme designsystem som resten af appen — tokens er 1:1 fra /opret. */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:#0F1E35; --ink-70:#3D5270; --ink-45:#6E7C93; --ink-20:#E3DFDA;
      --dim:#8B8FB5; --rule:#EAE6DF; --field:#F5F0E8; --paper:#F0EBE4;
      --card-alt:#EBE7E0; --white:#FFFFFF;
      --gold:#C9A84C; --gold-light:#E8C96A; --gold-tint:#FDF6D9; --gold-ink:#8A6E15;
      --D:#E05C3A; --I:#F5A623; --S:#4CAF7D; --C:#4A7FCB; --stop:#C62828;
      --disp:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    }

    body {
      font-family: var(--disp);
      background: var(--card-alt);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink-70);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1,h2,h3,h4 { font-weight:800; letter-spacing:-.015em; color:var(--ink); line-height:1.14; }
    a { color: inherit; }
    :focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

    .shell { max-width:1140px; margin:0 auto; padding:0 24px; width:100%; }
    .grad { height:5px; background:linear-gradient(90deg,var(--D) 0%,var(--I) 34%,var(--S) 67%,var(--C) 100%); }

    /* header */
    .top { background: var(--ink); }
    .toprow { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; flex-wrap:wrap; }
    .logo { display:inline-block; text-decoration:none; }
    .logo .dots { display:flex; gap:4px; justify-content:flex-end; margin:0 3px 4px 0; }
    .logo .dots i { width:7px; height:7px; border-radius:50%; }
    .logo .dots i:nth-child(1){background:var(--D)} .logo .dots i:nth-child(2){background:var(--I)}
    .logo .dots i:nth-child(3){background:var(--S)} .logo .dots i:nth-child(4){background:var(--C)}
    .logo .wordmark { display:block; font-weight:800; font-size:24px; line-height:1; letter-spacing:-.02em; color:#fff; }
    .top a.back { font-size:13.5px; color:var(--dim); text-decoration:none; }
    .top a.back:hover { color:#fff; }

    main { flex:1; padding:44px 0 64px; }

    .container {
      max-width: 1170px;
      margin: 0 auto;
    }

    .eyebrow { font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-ink); margin:0 0 10px; }

    .header {
      text-align: left;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 0;
    }

    .header h1::after { content:""; display:block; width:56px; height:3px; background:var(--gold); margin:15px 0 18px; }

    .header p {
      font-size: 1.05rem;
      color: var(--ink-45);
    }

    .company-badge {
      display: inline-block;
      background: var(--gold-tint);
      border: 1px solid #EBDBA0;
      color: var(--gold-ink);
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 1rem;
    }

    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .profile-card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .profile-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 38px -20px rgba(15,30,53,.34);
    }

    .profile-icon {
      width: 56px;
      height: 56px;
      background: var(--ink);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .profile-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.015em;
      margin-bottom: 0.5rem;
      color: var(--ink);
    }

    .profile-description {
      font-size: 0.9rem;
      color: var(--ink-45);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .profile-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--ink-45);
    }

    .profile-meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .start-btn {
      display: block;
      width: 100%;
      padding: 0.875rem;
      background: var(--gold);
      border: 1px solid var(--gold);
      color: #2A2005;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
      text-align: center;
      text-decoration: none;
    }

    .start-btn:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
    }

    .loading i {
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 1rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .error {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
    }

    .error i {
      font-size: 3rem;
      color: var(--stop);
      margin-bottom: 1rem;
    }

    .error h2 {
      margin-bottom: 0.5rem;
    }

    .error p {
      color: var(--ink-45);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
    }

    .empty-state i {
      font-size: 3rem;
      color: var(--ink-45);
      margin-bottom: 1rem;
    }

    /* Search and view controls */
    .controls-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.75rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
    }

    .search-box input:focus {
      outline: 2px solid var(--gold);
      outline-offset: 0;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-45);
    }

    .view-toggle {
      display: flex;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.25rem;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
    }

    .view-btn {
      padding: 0.625rem 1rem;
      border: none;
      background: transparent;
      color: var(--ink-45);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 1rem;
    }

    .view-btn.active {
      background: var(--ink);
      color: var(--gold);
    }

    .view-btn:hover:not(.active) {
      background: var(--field);
    }

    /* List view styles */
    .profiles-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .profile-list-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .profile-list-item:hover {
      transform: translateX(4px);
      box-shadow: 0 14px 38px -20px rgba(15,30,53,.34);
    }

    .profile-list-item .profile-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 0;
      flex-shrink: 0;
      font-size: 1.25rem;
    }

    .profile-list-item .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-list-item .profile-name {
      margin-bottom: 0.25rem;
    }

    .profile-list-item .profile-description {
      margin-bottom: 0;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .profile-list-item .start-btn {
      margin-top: 0;
      width: auto;
      padding: 0.625rem 1.25rem;
      flex-shrink: 0;
    }

    .no-results {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15,30,53,.05);
      color: var(--ink-45);
    }

    /* footer */
    .foot { background: var(--ink); color: var(--dim); }
    .footrow { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:20px 0; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .footrow a { text-decoration:none; }
    .footrow a:hover { color:#fff; }

    @media (max-width:720px){
      .header h1 { font-size:28px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="shell">
      <div class="toprow">
        <a class="logo" href="/">
          <span class="dots"><i></i><i></i><i></i><i></i></span>
          <span class="wordmark">Master DISC</span>
        </a>
        <a class="back" href="/">&#8592; Til forsiden</a>
      </div>
    </div>
    <div class="grad"></div>
  </header>

  <main>
  <div class="shell container">
    <div class="header">
      <p class="eyebrow">Profiltest</p>
      <h1>DISC Profiltest</h1>
      <p>Velkommen til din personlige DISC profilanalyse</p>
      <div id="companyLogo" style="display: none; margin-top: 1.5rem;">
        <img id="companyLogoImg" src="" alt="Company logo" style="max-height: 60px; max-width: 200px; object-fit: contain; background: white; padding: 8px; border-radius: 8px;" />
      </div>
      <div class="company-badge" id="companyBadge" style="display: none;">
        <i class="fas fa-building"></i>
        <span id="companyName">Virksomhed</span>
      </div>
    </div>

    <div id="content">
      <div class="loading">
        <i class="fas fa-circle-notch fa-spin"></i>
        <p>Indlaeser profiler...</p>
      </div>
    </div>
  </div>
  </main>

  <footer class="foot">
    <div class="shell">
      <div class="footrow">
        <span>MasterDISC · Et Finsx-koncept</span>
        <a href="mailto:pb@coachers.dk">pb@coachers.dk</a>
        <span>masterdisc.dk</span>
      </div>
    </div>
    <div class="grad"></div>
  </footer>

  <script type="module">
    // Company profiles now come from the Supabase-backed Next.js API
    // (coachersuniversed), not Firebase Cloud Functions. Override
    // window.DISC_API_BASE before this script to point at a staging deployment.
    const DISC_API_BASE = (window.DISC_API_BASE || 'https://www.unicoachers.dk').replace(/\/$/, '');

    const contentDiv = document.getElementById('content');
    const companyBadge = document.getElementById('companyBadge');
    const companyNameSpan = document.getElementById('companyName');

    // Get company slug from URL
    // Fase 1: the page moved from /survey/<slug> to /profil/survey/<slug>, so the
    // slug is read as the segment right after "survey" instead of as path segment
    // number two. Works at both locations.
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const surveyIndex = pathParts.lastIndexOf('survey');
    const companySlug =
      surveyIndex > -1 && pathParts.length > surveyIndex + 1 ? pathParts[surveyIndex + 1] : null;

    // State
    let allProfiles = [];
    let currentCompany = null;
    let currentView = 'grid'; // 'grid' or 'list'
    let searchTerm = '';

    async function loadCompanyProfiles() {
      if (!companySlug) {
        showError('Ingen virksomhed angivet', 'Angiv venligst en virksomhed i URL\'en');
        return;
      }

      try {
        // Supabase-backed API endpoint (replaces the getCompanyProfiles callable).
        const response = await fetch(
          DISC_API_BASE + '/api/disc/company-profiles?companySlug=' + encodeURIComponent(companySlug),
        );
        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.ok) {
          showError('Fejl ved indlæsning', 'Kunne ikke indlæse profiler');
          return;
        }

        const { company, profiles } = result;
        currentCompany = company;

        // Sort profiles alphabetically by name (ASC)
        allProfiles = profiles.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'da'));

        // Show company logo if available
        if (company.logoUrl) {
          document.getElementById('companyLogoImg').src = company.logoUrl;
          document.getElementById('companyLogo').style.display = 'block';
        }

        // Show company name
        companyNameSpan.textContent = company.name;
        companyBadge.style.display = 'inline-block';

        if (profiles.length === 0) {
          showEmptyState();
          return;
        }

        renderProfiles();

      } catch (err) {
        console.error('Error loading profiles:', err);
        if (err.code === 'functions/not-found') {
          showError('Virksomhed ikke fundet', 'Den angivne virksomhed findes ikke i systemet');
        } else {
          showError('Fejl ved indlæsning', 'Kunne ikke indlæse profiler. Prøv igen senere.');
        }
      }
    }

    function getFilteredProfiles() {
      if (!searchTerm) return allProfiles;
      const term = searchTerm.toLowerCase();
      return allProfiles.filter(p =>
        (p.name || '').toLowerCase().includes(term) ||
        (p.description || '').toLowerCase().includes(term) ||
        (p.detectorTitle || '').toLowerCase().includes(term)
      );
    }

    function renderProfiles() {
      const filtered = getFilteredProfiles();

      const controlsHtml = `
        <div class="controls-bar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="profileSearch" placeholder="Søg efter profil..." value="${searchTerm}" />
          </div>
          <div class="view-toggle">
            <button class="view-btn ${currentView === 'grid' ? 'active' : ''}" onclick="setView('grid')" title="Kortvisning">
              <i class="fas fa-th-large"></i>
            </button>
            <button class="view-btn ${currentView === 'list' ? 'active' : ''}" onclick="setView('list')" title="Listevisning">
              <i class="fas fa-list"></i>
            </button>
          </div>
        </div>
      `;

      if (filtered.length === 0) {
        contentDiv.innerHTML = controlsHtml + `
          <div class="no-results">
            <i class="fas fa-search" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
            <p>Ingen profiler matcher "${searchTerm}"</p>
          </div>
        `;
        attachSearchListener();
        return;
      }

      if (currentView === 'grid') {
        contentDiv.innerHTML = controlsHtml + `
          <div class="profiles-grid">
            ${filtered.map(p => `
              <div class="profile-card" onclick="selectProfile('${p.slug}', '${currentCompany.slug}')">
                <div class="profile-icon">
                  <i class="fas fa-briefcase"></i>
                </div>
                <div class="profile-name">${p.name || 'Unavngivet profil'}</div>
                <div class="profile-description">${p.description || p.detectorTitle || 'Tag denne DISC profiltest for at få indsigt i dine styrker og udviklingsområder.'}</div>
                <div class="profile-meta">
                  <span><i class="fas fa-layer-group"></i> ${p.categoryCount || 0} kategorier</span>
                  <span><i class="fas fa-clock"></i> Ca. 10 min</span>
                </div>
                <button class="start-btn">
                  <i class="fas fa-play"></i> Start test
                </button>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        contentDiv.innerHTML = controlsHtml + `
          <div class="profiles-list">
            ${filtered.map(p => `
              <div class="profile-list-item" onclick="selectProfile('${p.slug}', '${currentCompany.slug}')">
                <div class="profile-icon">
                  <i class="fas fa-briefcase"></i>
                </div>
                <div class="profile-info">
                  <div class="profile-name">${p.name || 'Unavngivet profil'}</div>
                  <div class="profile-description">${p.description || p.detectorTitle || 'Tag denne DISC profiltest.'}</div>
                </div>
                <div class="profile-meta" style="flex-direction: column; gap: 0.25rem; align-items: flex-end;">
                  <span><i class="fas fa-layer-group"></i> ${p.categoryCount || 0} kategorier</span>
                  <span><i class="fas fa-clock"></i> Ca. 10 min</span>
                </div>
                <button class="start-btn">
                  <i class="fas fa-play"></i> Start
                </button>
              </div>
            `).join('')}
          </div>
        `;
      }

      attachSearchListener();
    }

    function attachSearchListener() {
      const searchInput = document.getElementById('profileSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchTerm = e.target.value;
          renderProfiles();
          // Restore focus and cursor position
          const newInput = document.getElementById('profileSearch');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(searchTerm.length, searchTerm.length);
          }
        });
      }
    }

    window.setView = function(view) {
      currentView = view;
      renderProfiles();
    };

    function showError(title, message) {
      contentDiv.innerHTML = `
        <div class="error">
          <i class="fas fa-exclamation-triangle"></i>
          <h2>${title}</h2>
          <p>${message}</p>
        </div>
      `;
    }

    function showEmptyState() {
      contentDiv.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-clipboard-list"></i>
          <h2>Ingen profiler tilgaengelige</h2>
          <p>Der er endnu ikke tildelt nogen profiler til denne virksomhed.</p>
        </div>
      `;
    }

    // Global function to select profile and redirect
    window.selectProfile = function(profileSlug, companySlug) {
      // Redirect to the main survey page with the profile and company.
      // Fase 1: the DISC flow lives at /profil/ now, not at the site root.
      window.location.href = `/profil/?profile=${profileSlug}&company=${companySlug}`;
    };

    // Load profiles on page load
    loadCompanyProfiles();
  </script>
</body>
</html>
